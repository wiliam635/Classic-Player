plugins {
    id 'com.android.application'
}

android {
    namespace 'com.classickeys.classicplayer'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.classickeys.classicplayer'
        minSdk 23 // Android 6.0
        targetSdk 35
        versionCode 100
        versionName '1.0.0'
        ndk {
            // Most Android 6+ tablets in use today are 64-bit ARM. Keeping this
            // ABI explicit ensures the real native SoundFont renderer is shipped.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}
