<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Classic Player - Conceito D do zero</title>
<style>
@page{size:1280px 800px;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0d10}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#e8ecf0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:1280px;height:800px;background:#0f1114;padding:34px 44px 30px;position:relative;page-break-after:always;overflow:hidden;display:flex;flex-direction:column}
.pg header h1{margin:0;font-size:26px}.pg header p{margin:4px 0 0;font-size:13px;color:#8b95a1}
.pgbody{flex:1;display:flex;gap:26px;margin-top:16px;min-height:0}
.main{flex:1;display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-width:0}
.side{width:290px;border-left:1px solid #2b323b;padding-left:20px;font-size:12px;line-height:1.5;color:#c3ccd4}
.side h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:#f5a524}.side ul{margin:0 0 14px;padding-left:16px}.side li{margin-bottom:5px}.side .old{color:#d98b8b}
footer{position:absolute;left:44px;right:44px;bottom:12px;font-size:10px;color:#667079;display:flex;justify-content:space-between}
.win{border:1px solid #2b323b;border-radius:10px;overflow:hidden;background:#0f1114}
.top{height:44px;background:#171a1f;border-bottom:1px solid #2b323b;display:flex;align-items:center;gap:10px;padding:0 12px}
.logo{font-weight:700;letter-spacing:.06em;color:#f5a524;font-size:13px}
.btn{height:28px;border:1px solid #2b323b;border-radius:6px;background:#1f242b;display:flex;align-items:center;justify-content:center;padding:0 10px;font-size:11px;font-weight:600;white-space:nowrap;color:#e8ecf0}
.btn.pri{background:#f5a524;border-color:#f5a524;color:#14100a}.btn.sm{height:22px;font-size:10px;padding:0 7px}.btn.dng{background:#3a1d22;border-color:#7a3340;color:#ffb3bd}.btn.ghost{background:transparent}
.sel{height:28px;border:1px solid #2b323b;border-radius:6px;background:#171a1f;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px;white-space:nowrap}.sel i{font-style:normal;color:#8b95a1}
.lbl{font-size:9px;font-weight:600;letter-spacing:.08em;color:#8b95a1;text-transform:uppercase;margin-bottom:4px}
.row{display:flex;gap:8px}
.seg{display:flex;background:#171a1f;border:1px solid #2b323b;border-radius:6px;padding:2px;gap:2px}.seg div{flex:1;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#8b95a1;padding:0 10px;white-space:nowrap}.seg .on{background:#2b323b;color:#e8ecf0}.seg.am .on{background:#f5a524;color:#14100a}
.rail{width:236px;background:#13161a;border-right:1px solid #2b323b;padding:8px;display:flex;flex-direction:column;gap:6px}
.lr{height:50px;border:1px solid #2b323b;border-radius:6px;background:#171a1f;display:flex;align-items:center;gap:8px;padding:0 8px}.lr.sel2{border-color:#f5a524;background:#1d1a14}
.lr .dot{width:8px;height:30px;border-radius:2px}.lr .n{flex:1;min-width:0}.lr .n b{display:block;font-size:11px}.lr .n span{font-size:9px;color:#8b95a1;white-space:nowrap}
.lr .ms{display:flex;gap:3px}.lr .ms i{font-style:normal;font-size:9px;font-weight:700;border:1px solid #2b323b;border-radius:3px;padding:2px 4px;color:#8b95a1}
.mt{width:4px;height:30px;background:#0b0d10;border-radius:2px;position:relative;overflow:hidden}.mt:after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--m);background:#4cc9f0}
.tabs{display:flex;gap:2px;border-bottom:1px solid #2b323b;padding:0 12px}.tabs div{padding:10px 14px;font-size:11px;font-weight:600;color:#8b95a1}.tabs .on{color:#f5a524;border-bottom:2px solid #f5a524}
.card{border:1px solid #2b323b;border-radius:8px;background:#13161a;padding:12px}
.kn{width:56px;height:56px;border-radius:50%;background:conic-gradient(from 225deg,#f5a524 var(--v),#2b323b 0);position:relative;margin:0 auto}
.kn:before{content:"";position:absolute;inset:5px;border-radius:50%;background:#1f242b}
.kn:after{content:"";position:absolute;left:50%;top:9px;width:2px;height:14px;margin-left:-1px;background:#e8ecf0;transform-origin:1px 19px;transform:rotate(var(--r))}
.kc{flex:1;text-align:center;min-width:0}.kc .lbl{text-align:center;white-space:nowrap}.kc .v{font-size:15px;font-weight:600;margin-top:6px}.kc .u{font-size:9px;color:#8b95a1}
.slot{border:1px solid #2b323b;border-radius:8px;background:#171a1f;padding:10px;position:relative}.slot b{font-size:11px}.slot span{display:block;font-size:10px;color:#8b95a1;margin-top:3px}
.fx{width:128px;border:1px solid #2b323b;border-radius:8px;background:#171a1f;padding:10px;text-align:center}.fx.on{border-color:#f5a524}.fx b{font-size:11px}.fx i{display:block;font-style:normal;font-size:9px;color:#8b95a1;margin-top:4px}
.arrow{align-self:center;color:#5b6672;font-size:18px}
.badge{position:absolute;right:4px;top:4px;font-size:8px;font-weight:700;background:#4cc9f0;color:#06141a;border-radius:3px;padding:1px 4px}
.win[style*="270px"] .kn{width:44px;height:44px}.win[style*="270px"] .kn:before{inset:4px}.win[style*="270px"] .kn:after{top:7px;height:10px;transform-origin:1px 15px}.win[style*="270px"] .tabs div{padding:10px 7px;font-size:10px}.win[style*="270px"] .seg div{padding:0 5px}
table{border-collapse:collapse;font-size:11px;width:100%}th,td{border:1px solid #2b323b;padding:6px 8px;text-align:left;vertical-align:top}th{background:#171a1f;color:#8b95a1;font-size:10px;letter-spacing:.08em}
.big{font-size:44px;font-weight:700;color:#f5a524;line-height:1}
</style></head><body>
<script>
const sel=(l,t,f='1')=>`<div style="flex:${f};min-width:0">${l?`<div class=lbl>${l}</div>`:''}<div class=sel>${t}<i>⌄</i></div></div>`;
const btn=(t,c='',s='')=>`<div class="btn ${c}" style="${s}">${t}</div>`;
const kn=(l,v,f,u)=>`<div class=kc><div class=lbl>${l}</div><div class=kn style="--v:${f*75}%;--r:${-135+f*270}deg"></div><div class=v>${v}</div><div class=u>${u||'&nbsp;'}</div></div>`;
const row=(x,s='')=>`<div class=row style="${s}">${x}</div>`;
const seg=(items,on,c='',s='')=>`<div class="seg ${c}" style="${s}">${items.map((x,i)=>`<div class="${i==on?'on':''}">${x}</div>`).join('')}</div>`;
const win=(body,w,h)=>`<div class=win style="width:${w}px;${h?'height:'+h+'px;':''}display:flex;flex-direction:column">${body}</div>`;
const card=(t,body,s='')=>`<div class=card style="${s}">${t?`<div class=lbl style="margin-bottom:10px">${t}</div>`:''}${body}</div>`;
const tabs=(items,on)=>`<div class=tabs>${items.map((x,i)=>`<div class="${i==on?'on':''}">${x}</div>`).join('')}</div>`;
const notes=(sec)=>`<div class=side>${sec.map(([h,items,cls])=>`<h3>${h}</h3><ul>${items.map(i=>`<li class="${cls||''}">${i}</li>`).join('')}</ul>`).join('')}</div>`;
const page=(n,t,s,body,side)=>`<section class=pg><header><h1>${t}</h1><p>${s}</p></header><div class=pgbody><div class=main>${body}</div>${side?notes(side):''}</div><footer><span>Classic Player · conceito D, do zero</span><span>página ${n}</span></footer></section>`;
const lr=(n,name,inst,c,on,m)=>`<div class="lr ${on?'sel2':''}"><div class=dot style="background:${c}"></div><div class=n><b>${n} · ${name}</b><span>${inst}</span></div><div class=mt style="--m:${m}%"></div><div class=ms><i>M</i><i>S</i></div></div>`;
const rail=(sel,max=8)=>`<div class=rail>${[lr(1,'NPNO','Royal Grand 3D','#f5a524',sel==1,70),lr(2,'NSMP','Sem amostra','#4cc9f0',sel==2,0),lr(3,'SF2','Sem SoundFont','#9ad66b',sel==3,0),lr(4,'DX7','E.PIANO 1','#c58bff',sel==4,40),lr(5,'Hammond','Jimmy Gospel','#ff8a5c',sel==5,55),lr(6,'Moog','Classic Keys Analog','#5ee0c0',sel==6,30),lr(7,'Drum Pads','8 pads','#ff6f91',sel==7,0),lr(8,'Pad Contínuo','12 notas','#8f9bff',sel==8,0)].slice(0,max).join('')}<div style="flex:1"></div>${btn('+ CAMADA','ghost','width:100%')}</div>`;
const topbar=(mode,c)=>c?`<div class=top><div class=logo style="font-size:11px">CP</div><div style="flex:1"></div>${seg(['PALCO','MIXER','LIVE'],mode,'am','width:200px')}<div style="flex:1"></div></div>`:`<div class=top><div class=logo>CLASSIC PLAYER</div><div style="width:150px">${sel('','NOVO PROGRAMA')}</div>${btn('Programa ⌄','ghost')}<div style="flex:1"></div>${seg(['PALCO','MIXER','LIVE SET'],mode,'am','width:270px')}<div style="flex:1"></div><div style="font-size:10px;color:#8b95a1">CPU 3%</div><div style="width:70px;height:6px;background:#0b0d10;border-radius:3px"><div style="width:12%;height:6px;background:#4cc9f0;border-radius:3px"></div></div><div style="font-size:10px;color:#8b95a1">MASTER</div><div style="width:90px;height:6px;background:#2b323b;border-radius:3px"><div style="width:70%;height:6px;background:#f5a524;border-radius:3px"></div></div>${btn('EQ','sm')}${btn('LIM','sm')}</div>`;
const foot=(learn)=>`<div style="height:40px;border-top:1px solid #2b323b;background:#171a1f;display:flex;align-items:center;gap:8px;padding:0 12px">${btn('● GRAVAR','')}${btn('TECLADO','ghost')}${btn('ÁUDIO / MIDI','ghost')}<div style="flex:1"></div>${btn(learn?'MIDI LEARN: LIGADO':'MIDI LEARN','',learn?'background:#4cc9f0;color:#06141a;border-color:#4cc9f0':'')}${btn('PANIC','dng')}</div>`;
const P=[];

/* 1 principios */
P.push(`<section class=pg style="justify-content:center"><div style="font-size:12px;letter-spacing:.3em;color:#f5a524">CLASSIC PLAYER · CONCEITO D</div><h1 style="font-size:44px;margin:10px 0 6px">Uma janela, um inspetor</h1><div style="font-size:17px;color:#8b95a1;margin-bottom:28px;max-width:860px">Começando do zero: em vez de repintar as 20 janelas atuais, o app passa a ter uma janela principal com lista de layers à esquerda e um inspetor com abas à direita. Quase tudo que hoje abre em pop-up vira aba.</div>
<div style="display:flex;gap:40px;margin-bottom:26px"><div><div class=big>1</div><div style="font-size:12px;color:#8b95a1;margin-top:6px">janela de edição<br>(hoje ~20 janelas)</div></div><div><div class=big>5</div><div style="font-size:12px;color:#8b95a1;margin-top:6px">abas por layer:<br>Som, Envelope, MIDI, Efeitos, Velocity</div></div><div><div class=big>1</div><div style="font-size:12px;color:#8b95a1;margin-top:6px">modo MIDI Learn global<br>(hoje 5 botões LEARN por layer)</div></div><div><div class=big>3</div><div style="font-size:12px;color:#8b95a1;margin-top:6px">modos de tela:<br>Palco, Mixer, Live Set</div></div></div>
<table style="width:900px"><tr><th>Princípio</th><th>O que significa</th></tr>
<tr><td>Editar no lugar</td><td>Selecionar uma layer mostra o seu inspetor na mesma janela; nada de pop-ups empilhados.</td></tr>
<tr><td>Uma regra por tipo de controle</td><td>Um botão, um seletor, um segmentado, um knob. Sem variações por janela.</td></tr>
<tr><td>Cor só quando informa</td><td>Âmbar = ativo ou selecionado. Ciano = sinal e medidores. Cor do motor = ponto na lista de layers.</td></tr>
<tr><td>Barato de desenhar</td><td>Superfícies planas, sem gradientes pesados nem sombras: o JUCE desenha rápido e a interface consome menos CPU.</td></tr>
<tr><td>Mesmo som, mesmos presets</td><td>Nenhum parâmetro de áudio muda. É reorganização e visual.</td></tr></table>
<div style="margin-top:20px;font-size:12px;color:#8b95a1">Páginas: 2 janela principal · 3 inspetor Som · 4 inspetor de motores (Hammond e Moog) · 5 abas Envelope, Velocity e Efeitos · 6 Palco, Mixer e MIDI Learn · 7 sistema visual, esforço e riscos</div></section>`);

/* 2 principal */
P.push(page(2,'Janela principal','Lista de layers à esquerda, inspetor da layer selecionada, barra global em cima e embaixo.',
win(topbar(0)+`<div style="display:flex;flex:1">${rail(1)}<div style="flex:1;display:flex;flex-direction:column">
<div style="padding:12px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2b323b"><div style="width:10px;height:36px;background:#f5a524;border-radius:2px"></div><div style="flex:1"><div style="font-size:15px;font-weight:700">Layer 1 · Piano Nord (NPNO)</div><div style="font-size:11px;color:#8b95a1">Royal Grand 3D · 128 vozes · canal omni</div></div>${btn('Exportar','ghost')}${btn('Importar','ghost')}${btn('Reset','ghost')}</div>
${tabs(['SOM','ENVELOPE','MIDI','EFEITOS','VELOCITY'],0)}
<div style="padding:14px;display:flex;flex-direction:column;gap:12px">${card('FONTE',row(sel('Categoria','Piano acústico','.7')+sel('Biblioteca NPNO','Royal Grand 3D','1.4')+btn('Importar NPNO','','align-self:flex-end')+btn('Importar bundle','','align-self:flex-end')))}
${card('TIMBRE',row(`<div style="width:300px"><div class=lbl>Voicing</div>${seg(['OFF','SOFT','MID','BRIGHT'],0,'am')}</div>${sel('Dyn comp','Off','.4')+sel('Cauda','Original','.5')}`))}
${card('CONTROLES',`<div style="display:flex">${kn('Volume',80,.6,'%')}${kn('Cutoff',100,1,'%')}${kn('Reverb',0,0,'%')}${kn('Comp',0,0,'%')}${kn('EQ low','0,0',.5,'dB')}${kn('EQ mid','0,0',.5,'dB')}${kn('EQ high','0,0',.5,'dB')}${kn('Ganho','0,0',.5,'dB')}</div>`)}</div></div></div>`+foot(false),840,640),
[['O QUE MUDA',['Os botões EDITAR/RESET de 8 faixas saem; a lista seleciona a layer.','Medidor e M/S ficam em cada linha da lista.','Programa, CPU, master, EQ e LIM numa barra única em cima.','Attack e Release passam para a aba Envelope.'],'old'],['PARA QUE',['Ver e trocar de layer sem abrir janela.','Cabe em telas pequenas: a lista tem altura fixa por layer.']]]));

/* 3 inspetor MIDI e som */
P.push(page(3,'Inspetor: abas MIDI e Som','O que hoje ocupa nove caixas em "Editar layer" vira quatro cartões numa aba.',
row(win(tabs(['SOM','ENVELOPE','MIDI','EFEITOS','VELOCITY'],2)+`<div style="padding:14px;display:flex;flex-direction:column;gap:12px">${card('ENTRADA',row(sel('Canal MIDI','MIDI omni')+sel('Entrada MIDI','Todos os controladores','1.6')+sel('Modo','Poli')+sel('Sustain','Sustain on')))}${card('TECLADO',row(sel('Oitava','0 oit','.7')+sel('Polifonia','128 vozes')+sel('Vel. mín.','1','.6')+sel('Vel. máx.','127','.6'))+`<div style="height:10px"></div>`+row(`<div style="flex:1"><div class=lbl>Split (nota baixa / alta)</div>${row(btn('GRAVE','','flex:1')+btn('AGUDO','','flex:1')+btn('Reset','ghost'))}</div><div style="flex:1"><div class=lbl>Sensibilidade</div>${seg(['LIGADA','DESLIGADA'],0,'am')}</div>`))}${card('CONTROLADORES',row(`<div style="flex:1"><div class=lbl>Modulação do teclado</div>${seg(['OFF','ON'],0,'am')}</div><div style="flex:1"><div class=lbl>Pitch bend</div>${seg(['OFF','ON'],1,'am')}</div>`))}</div>`,420,520)+
win(tabs(['SOM','ENVELOPE','MIDI','EFEITOS','VELOCITY'],0)+`<div style="padding:14px;display:flex;flex-direction:column;gap:12px">${card('FONTE',sel('Biblioteca NPNO','Royal Grand 3D')+`<div style="height:8px"></div>`+row(btn('Importar NPNO','','flex:1')+btn('Importar bundle','','flex:1')+btn('Excluir','dng','')))}${card('TIMBRE',seg(['OFF','SOFT','MID','BRIGHT'],0,'am')+`<div style="height:10px"></div>`+row(sel('Dyn comp','Off')+sel('Cauda','Original')+sel('Reflexões','Não')))}${card('CONTROLES',`<div style="display:flex">${kn('Volume',80,.6,'%')}${kn('Cutoff',100,1,'%')}${kn('Reverb',0,0,'%')}${kn('Comp',0,0,'%')}</div>`)}</div>`,400,520),'gap:14px;align-items:flex-start'),
[['O QUE MUDA',['Liga/desliga viram segmentados (modulação, pitch bend, sensibilidade) em vez de botões grandes com texto "ON/OFF".','"DESLIGAR SENSIBILIDADE" vira estado visível, não ação.','Excluir fica vermelho e separado, para evitar clique por engano.'],'old'],['MESMA ESTRUTURA PARA',['NPNO, NSMP, SF2, DX7, Hammond, Moog: muda só o cartão FONTE.']]]));

/* 4 hammond e moog */
const db=(l,v,f,red)=>`<div class=kc><div class=lbl>${l}</div><div style="height:96px;width:26px;margin:0 auto;background:#0b0d10;border:1px solid #2b323b;border-radius:4px;position:relative"><div style="position:absolute;left:2px;right:2px;top:${(1-f)*70+3}px;height:18px;border-radius:2px;background:${red?'#d65151':'#e6e0d2'}"></div></div><div class=v style="font-size:13px">${v}</div></div>`;
P.push(page(4,'Inspetor dos motores: Hammond e Moog','O que é próprio do motor ganha uma aba SOM específica; o resto é igual aos outros.',
row(win(tabs(['SOM','ENVELOPE','MIDI','EFEITOS','VELOCITY'],0)+`<div style="padding:14px;display:flex;flex-direction:column;gap:12px">${card('PRESET',sel('Órgão','Jimmy Gospel'))}${card('DRAWBARS',`<div style="display:flex">${[['16\'',8,1,1],['5⅓\'',8,1,1],['8\'',7,.9],['4\'',6,.75],['2⅔\'',8,1,1],['2\'',5,.6],['1⅗\'',4,.5],['1⅓\'',3,.4],['1\'',2,.25]].map(a=>db(...a)).join('')}</div>`)}${row(card('LESLIE',seg(['STOP','CHORALE','FAST'],1,'am'),'flex:1')+card('PERCUSSÃO',seg(['OFF','2ND','3RD'],0,'am'),'flex:1'))}${card('CARÁTER',`<div style="display:flex">${kn('Key click','15','.15','%')}${kn('Leakage','12','.12','%')}${kn('Drive','8','.08','%')}${kn('Level','75','.75','%')}</div>`)}</div>`,480,600)+
win(tabs(['SOM','ENVELOPE','MIDI','EFEITOS','VELOCITY'],0)+`<div style="padding:14px;display:flex;flex-direction:column;gap:12px">${card('PRESET',sel('Preset analógico','Inicial · browser 12 dB'))}${card('OSCILADORES E FILTRO',`<div style="display:flex;flex-wrap:wrap;row-gap:10px">${[['Osc 1','Saw',.5],['Osc 2','Saw',.5],['Osc 3','Sq',.3],['Cutoff','69',.69],['Resson.','30',.3],['Drive','0',0]].map(a=>`<div style="width:33.3%">${kn(a[0],a[1],a[2])}</div>`).join('')}</div>`)}${card('CONTROLES',`<div style="display:flex">${kn('Volume',80,.6,'%')}${kn('Reverb',0,0,'%')}${kn('Comp',0,0,'%')}</div>`)}</div>`,340,600),'gap:14px;align-items:flex-start'),
[['O QUE MUDA',['Drawbars, Leslie e percussão num só lugar, na aba SOM.','Moog: os parâmetros do sintetizador ficam agrupados (osciladores e filtro) e separados dos controles de camada.','Sliders horizontais de key click, leakage, drive e level viram knobs, como no resto.'],'old'],['NOTA',['O painel interno do Moog não estava nos seus prints; o agrupamento mostrado é uma proposta e precisa ser validado com o painel real.']]]));

/* 5 envelope velocity efeitos */
P.push(page(5,'Abas Envelope, Velocity e Efeitos','O que hoje são cinco janelas de efeito vira uma cadeia visual de blocos.',
row(win(tabs(['SOM','ENVELOPE','MIDI','EFEITOS','VELOCITY'],1)+`<div style="padding:14px;display:flex;flex-direction:column;gap:12px">${card('ENVELOPE',`<div style="height:110px;background:#0b0d10;border-radius:6px"><svg width=100% height=110 viewBox="0 0 400 110" preserveAspectRatio=none><polyline points="0,104 60,8 120,8 300,8 400,104" fill="rgba(245,165,36,.12)" stroke="#f5a524" stroke-width="2"/></svg></div><div style="display:flex;margin-top:10px">${kn('Attack','5,0',.05)}${kn('Decay','0',0,'ms')}${kn('Sustain','100',1,'%')}${kn('Release','50',.5)}</div>`)}</div>`,270,560)+
win(tabs(['SOM','ENVELOPE','MIDI','EFEITOS','VELOCITY'],4)+`<div style="padding:14px;display:flex;flex-direction:column;gap:12px">${card('CURVA',`<div style="height:130px;background:#0b0d10;border-radius:6px"><svg width=100% height=130 viewBox="0 0 300 130" preserveAspectRatio=none><line x1=0 y1=130 x2=300 y2=0 stroke="#f5a524" stroke-width="2"/></svg></div>`+`<div style="height:8px"></div>`+seg(['LINEAR','SOFT','HARD','AJUSTAR','DESENHAR'],0,'am'))}${card('ÚLTIMO TOQUE',`<div style="font-size:12px">Recebida <b>43</b> → curva <b>43</b> → camada <b>104 de 166</b></div><div style="height:8px"></div>${row(sel('Piso de timbre','1'))}`)}</div>`,270,560)+
