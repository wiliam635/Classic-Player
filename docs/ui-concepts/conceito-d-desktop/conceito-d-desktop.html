<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Classic Player - Conceito D desktop</title>
<style>
@page{size:1700px 1160px;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0d10}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#e8ecf0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:1700px;height:1160px;background:#0f1114;padding:34px 44px 34px;position:relative;page-break-after:always;overflow:hidden;display:flex;flex-direction:column}
.pg header h1{margin:0;font-size:26px}.pg header p{margin:4px 0 0;font-size:13px;color:#8b95a1}
.pgbody{flex:1;display:flex;gap:26px;margin-top:16px;min-height:0}
.main{display:flex;flex-direction:column;gap:14px;align-items:flex-start;min-width:0}
.side{flex:1;border-left:1px solid #2b323b;padding-left:20px;font-size:12px;line-height:1.55;color:#c3ccd4}
.side h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:#f5a524}.side ul{margin:0 0 14px;padding-left:16px}.side li{margin-bottom:6px}.side .old{color:#d98b8b}
footer{position:absolute;left:44px;right:44px;bottom:12px;font-size:10px;color:#667079;display:flex;justify-content:space-between}
.win{border:1px solid #2b323b;border-radius:8px;overflow:hidden;background:#0f1114;display:flex;flex-direction:column}
.top{height:36px;background:#171a1f;border-bottom:1px solid #2b323b;display:flex;align-items:center;gap:10px;padding:0 12px;flex:none}
.logo{font-weight:700;letter-spacing:.06em;color:#f5a524;font-size:12px;white-space:nowrap}
.menu{font-size:11px;color:#b6c0c9;display:flex;gap:14px;margin:0 6px}
.btn{height:24px;border:1px solid #2b323b;border-radius:4px;background:#1f242b;display:flex;align-items:center;justify-content:center;padding:0 9px;font-size:11px;font-weight:600;white-space:nowrap;color:#e8ecf0}
.btn.pri{background:#f5a524;border-color:#f5a524;color:#14100a}.btn.sm{height:20px;font-size:10px;padding:0 6px}.btn.dng{background:#3a1d22;border-color:#7a3340;color:#ffb3bd}.btn.ghost{background:transparent}
.sel{height:24px;border:1px solid #2b323b;border-radius:4px;background:#171a1f;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;white-space:nowrap}.sel i{font-style:normal;color:#8b95a1;margin-left:6px}
.lbl{font-size:9px;font-weight:600;letter-spacing:.08em;color:#8b95a1;text-transform:uppercase;margin-bottom:3px}
.row{display:flex;gap:6px}
.seg{display:flex;background:#171a1f;border:1px solid #2b323b;border-radius:4px;padding:2px;gap:2px}.seg div{flex:1;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#8b95a1;padding:0 8px;white-space:nowrap}.seg .on{background:#2b323b;color:#e8ecf0}.seg.am .on{background:#f5a524;color:#14100a}
.tabs{display:flex;gap:2px;border-bottom:1px solid #2b323b;padding:0 12px;flex:none;align-items:flex-end;height:34px}.tabs div{padding:9px 14px;font-size:11px;font-weight:600;color:#8b95a1}.tabs .on{color:#f5a524;border-bottom:2px solid #f5a524}
.pn{border:1px solid #2b323b;border-radius:4px;background:#13161a}.pn>.h{height:20px;display:flex;align-items:center;padding:0 8px;font-size:9px;font-weight:700;letter-spacing:.1em;color:#8b95a1;border-bottom:1px solid #2b323b;background:#171a1f}.pn>.b{padding:8px;display:flex;flex-direction:column;gap:7px}
.kn{width:44px;height:44px;border-radius:50%;background:conic-gradient(from 225deg,#f5a524 var(--v),#2b323b 0);position:relative;margin:0 auto}
.kn:before{content:"";position:absolute;inset:4px;border-radius:50%;background:#1f242b}
.kn:after{content:"";position:absolute;left:50%;top:7px;width:2px;height:11px;margin-left:-1px;background:#e8ecf0;transform-origin:1px 15px;transform:rotate(var(--r))}
.kc{flex:1;text-align:center;min-width:0}.kc .lbl{text-align:center;white-space:nowrap}.kc .v{font-size:12px;font-weight:600;margin-top:4px}.kc .u{font-size:9px;color:#8b95a1}
.st{flex:1;min-width:0;border:1px solid #2b323b;border-radius:4px;background:#171a1f;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 4px;position:relative}
.st.sl{border-color:#f5a524;background:#1d1a14}.st>i{position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px 3px 0 0}
.st .nm{font-size:10px;font-weight:700;margin-top:4px;white-space:nowrap}.st .in{font-size:9px;color:#8b95a1;white-space:nowrap}
.fd{flex:1;width:100%;position:relative}.fd:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#0b0d10;border-radius:2px}.fd b{position:absolute;left:50%;margin-left:-12px;width:24px;height:11px;border-radius:2px;background:#cfd6db}
.mt{position:absolute;left:18%;top:0;bottom:0;width:4px;background:#0b0d10;border-radius:2px;overflow:hidden}.mt:after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--m);background:#4cc9f0}
.val{width:42px;height:18px;border:1px solid #2b323b;border-radius:3px;background:#0b0d10;font-size:10px;text-align:center;line-height:16px}
.fx{width:96px;border:1px solid #2b323b;border-radius:4px;background:#171a1f;padding:8px;text-align:center}.fx.on{border-color:#f5a524}.fx b{font-size:11px}.fx i{display:block;font-style:normal;font-size:9px;color:#8b95a1;margin-top:3px}
.arrow{align-self:center;color:#5b6672;font-size:16px}
.badge{position:absolute;font-size:8px;font-weight:700;background:#4cc9f0;color:#06141a;border-radius:3px;padding:1px 4px}
.slot{border:1px solid #2b323b;border-radius:4px;background:#171a1f;padding:12px;height:150px}.slot b{font-size:26px}.slot span{display:block;font-size:12px;margin-top:8px}.slot em{font-style:normal;font-size:10px;color:#8b95a1}
table{border-collapse:collapse;font-size:11.5px;width:100%}th,td{border:1px solid #2b323b;padding:7px 9px;text-align:left;vertical-align:top}th{background:#171a1f;color:#8b95a1;font-size:10px;letter-spacing:.08em}
.big{font-size:44px;font-weight:700;color:#f5a524;line-height:1}
.wf{border:1px dashed #5b6672;border-radius:4px;color:#8b95a1;font-size:10px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<script>
const sel=(l,t,f='1')=>`<div style="flex:${f};min-width:0">${l?`<div class=lbl>${l}</div>`:''}<div class=sel>${t}<i>⌄</i></div></div>`;
const btn=(t,c='',s='')=>`<div class="btn ${c}" style="${s}">${t}</div>`;
const kn=(l,v,f,u)=>`<div class=kc><div class=lbl>${l}</div><div class=kn style="--v:${f*75}%;--r:${-135+f*270}deg"></div><div class=v>${v}</div><div class=u>${u||'&nbsp;'}</div></div>`;
const row=(x,s='')=>`<div class=row style="${s}">${x}</div>`;
const seg=(items,on,c='',s='')=>`<div class="seg ${c}" style="${s}">${items.map((x,i)=>`<div class="${i==on?'on':''}">${x}</div>`).join('')}</div>`;
const pn=(t,body,s='')=>`<div class=pn style="${s}"><div class=h>${t}</div><div class=b>${body}</div></div>`;
const win=(body,w,h)=>`<div class=win style="width:${w}px;${h?'height:'+h+'px':''}">${body}</div>`;
const tabs=(items,on,right='')=>`<div class=tabs>${items.map((x,i)=>`<div class="${i==on?'on':''}">${x}</div>`).join('')}<div style="flex:1"></div>${right}</div>`;
const notes=(sec)=>`<div class=side>${sec.map(([h,items,cls])=>`<h3>${h}</h3><ul>${items.map(i=>`<li class="${cls||''}">${i}</li>`).join('')}</ul>`).join('')}</div>`;
const page=(n,t,s,body,side)=>`<section class=pg><header><h1>${t}</h1><p>${s}</p></header><div class=pgbody><div class=main>${body}</div>${side?notes(side):''}</div><footer><span>Classic Player · conceito D adaptado ao desktop</span><span>página ${n}</span></footer></section>`;
const T=['SOM','ENVELOPE','MIDI','EFEITOS','VELOCITY'];
const topbar=(mode)=>`<div class=top><div class=logo>CLASSIC PLAYER</div><div class=menu><span>Programa</span><span>Layer</span><span>Ver</span><span>Ferramentas</span><span>Ajuda</span></div><div style="width:200px">${sel('','NOVO PROGRAMA')}</div><div style="flex:1"></div>${seg(['PALCO','MIXER','LIVE SET'],mode,'am','width:250px')}<div style="flex:1"></div><div style="font-size:10px;color:#8b95a1">CPU 3%</div><div style="width:60px;height:5px;background:#0b0d10;border-radius:3px"><div style="width:12%;height:5px;background:#4cc9f0;border-radius:3px"></div></div><div style="font-size:10px;color:#8b95a1">MASTER</div><div style="width:90px;height:5px;background:#2b323b;border-radius:3px"><div style="width:70%;height:5px;background:#f5a524;border-radius:3px"></div></div>${btn('EQ','sm')}${btn('LIM','sm')}</div>`;
const foot=(learn)=>`<div style="height:36px;border-top:1px solid #2b323b;background:#171a1f;display:flex;align-items:center;gap:8px;padding:0 12px;flex:none">${btn('● GRAVAR WAV+MIDI','')}${btn('TECLADO','ghost')}${btn('ÁUDIO / MIDI','ghost')}<div style="width:150px">${sel('','Tema: Padrão')}</div>${btn('ATUALIZAÇÕES','ghost')}${btn('BACKUP','ghost')}<div style="flex:1"></div>${btn(learn?'MIDI LEARN: LIGADO':'MIDI LEARN','',learn?'background:#4cc9f0;color:#06141a;border-color:#4cc9f0':'')}${btn('PANIC','dng')}</div>`;
const L=[['NPNO','Sem piano Nord','#f5a524',.6],['NSMP','Sem amostra Nord','#4cc9f0',.05],['SF2','Sem SoundFont','#9ad66b',.05],['DX7','E.PIANO 1','#c58bff',.35],['HAMMOND','Jimmy Gospel','#ff8a5c',.5],['MOOG','Classic Keys Analog','#5ee0c0',.3],['DRUM PADS','8 pads','#ff6f91',.0],['PAD CONTÍNUO','12 notas','#8f9bff',.0]];
const mixer=(sl,h)=>`<div style="display:flex;gap:6px;padding:8px 10px;height:${h}px;background:#0f1114;border-top:1px solid #2b323b;flex:none">${L.map((a,i)=>`<div class="st ${i==sl?'sl':''}" style="${i>5?'flex:1.3':''}"><i style="background:${a[2]}"></i><div class=nm>${i+1} · ${a[0]}</div><div class=in>${a[1]}</div><div style="display:flex;gap:3px"><div class="btn sm" style="padding:0 6px">M</div><div class="btn sm" style="padding:0 6px">S</div></div><div class=fd><div class=mt style="--m:${a[3]*100}%"></div><b style="top:30%"></b></div><div class=val>80</div></div>`).join('')}</div>`;
const P=[];

/* 1 */
P.push(`<section class=pg style="justify-content:center"><div style="font-size:12px;letter-spacing:.3em;color:#f5a524">CLASSIC PLAYER · CONCEITO D ADAPTADO AO DESKTOP</div><h1 style="font-size:44px;margin:10px 0 6px">Mesmo modelo, proporção de PC e Mac</h1><div style="font-size:17px;color:#8b95a1;margin-bottom:26px;max-width:980px">O D original lembrava aplicativo de celular: lista lateral com cartões altos, controles grandes e uma coluna só. Aqui o modelo (inspetor com abas, cadeia de efeitos, MIDI Learn global, modos Palco/Mixer/Live Set) é mantido, mas reorganizado para a janela que o app já tem hoje: 1300 × 1060 px, larga, redimensionável e usada com mouse e teclado.</div>
<table style="width:1250px"><tr><th>No D de celular</th><th>No D de desktop</th><th>Por quê</th></tr>
<tr><td>Lista lateral de layers com cartões de 50 px</td><td>Mixer horizontal na parte de baixo, como o app já é hoje; clicar numa faixa seleciona a layer</td><td>Mantém a memória visual dos faders; o inspetor ganha toda a largura</td></tr>
<tr><td>Uma coluna de cartões por aba</td><td>Três colunas lado a lado (Fonte e Timbre, MIDI, Controles) sem rolar</td><td>Tela larga: ver tudo de uma vez</td></tr>
<tr><td>Controles de 28 a 32 px, cantos de 6-8 px</td><td>Controles de 24 px, cantos de 3-4 px, textos de 10-11 px</td><td>Densidade de ferramenta de música, alvo de mouse</td></tr>
<tr><td>Abas grandes sozinhas numa linha</td><td>Abas na mesma linha do nome da layer, mais barra de menus (Programa, Layer, Ver...)</td><td>Padrão de desktop; menos altura gasta</td></tr>
<tr><td>Slots enormes de palco</td><td>Palco só no modo Live Set; no modo normal tudo é compacto</td><td>Slots grandes servem para tocar ao vivo, não para editar</td></tr>
<tr><td>Foco em toque</td><td>Atalhos de teclado, dicas ao passar o mouse, setas para trocar de layer</td><td>Uso com mouse e teclado</td></tr></table>
<div style="margin-top:20px;font-size:12px;color:#8b95a1">Páginas: 2 janela principal · 3 Hammond e Moog · 4 Efeitos, Envelope e Velocity · 5 Live Set e MIDI Learn · 6 redimensionamento · 7 sistema visual, esforço e decisões</div></section>`);

/* 2 principal */
const col3=`<div style="display:flex;gap:10px;padding:10px;flex:1;min-height:0">
${pn('FONTE E TIMBRE',row(sel('Categoria','Piano acústico','.8')+sel('Biblioteca NPNO','Royal Grand 3D','1.2'))+row(btn('Importar NPNO','','flex:1')+btn('Importar bundle','','flex:1')+btn('Excluir','dng'))+`<div class=lbl style="margin:4px 0 0">Voicing</div>`+seg(['OFF','SOFT','MID','BRIGHT'],0,'am')+row(sel('Dyn comp','Off')+sel('Cauda','Original')+sel('Reflexões','Não')),'width:400px')}
${pn('MIDI',row(sel('Canal','MIDI omni')+sel('Modo','Poli')+sel('Sustain','Sustain on'))+row(sel('Entrada MIDI','Todos os controladores','1'))+row(sel('Oitava','0 oit')+sel('Polifonia','128 vozes')+sel('Vel. mín.','1','.7')+sel('Vel. máx.','127','.7'))+`<div class=lbl style="margin:2px 0 0">Split</div>`+row(btn('GRAVE','','flex:1')+btn('AGUDO','','flex:1')+btn('Reset','ghost'))+row(`<div style="flex:1"><div class=lbl>Sensibilidade</div>${seg(['LIGADA','DESLIGADA'],0,'am')}</div><div style="flex:1"><div class=lbl>Modulação</div>${seg(['OFF','ON'],0,'am')}</div><div style="flex:1"><div class=lbl>Pitch bend</div>${seg(['OFF','ON'],1,'am')}</div>`),'width:440px')}
${pn('CONTROLES DA CAMADA',`<div style="display:flex;flex-wrap:wrap;row-gap:12px">${[['Volume',80,.6,'%'],['Attack','5,0',.05,''],['Release',50,.5,''],['Cutoff',100,1,'%'],['Reverb',0,0,'%'],['Comp',0,0,'%'],['EQ low','0,0',.5,'dB'],['EQ mid','0,0',.5,'dB'],['EQ high','0,0',.5,'dB'],['Ganho','0,0',.5,'dB']].map(a=>`<div style="width:20%">${kn(...a)}</div>`).join('')}</div>`,'flex:1')}
</div>`;
P.push(page(2,'Janela principal','Proporção atual (1300 × 1060): inspetor em cima em três colunas, mixer embaixo.',
win(topbar(0)+`<div style="padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2b323b;flex:none"><div style="width:8px;height:26px;background:#f5a524;border-radius:2px"></div><div><b style="font-size:14px">Layer 1 · Piano Nord (NPNO)</b> <span style="font-size:11px;color:#8b95a1;margin-left:8px">Royal Grand 3D · 128 vozes · canal omni</span></div><div style="flex:1"></div>${btn('Exportar preset','ghost')}${btn('Importar preset','ghost')}${btn('Reset layer','ghost')}</div>`+tabs(T,0)+col3+mixer(0,480)+foot(false),1300,1060),
[['O QUE MUDA',['Os botões EDITAR e RESET de cada faixa saem: clicar na faixa seleciona a layer; Reset vai para o cabeçalho do inspetor.','Mixer continua visível o tempo todo, com faders altos como hoje.','Barra de menus e uma barra superior única (programa, modo, CPU, master, EQ, LIM).','Attack e Release saem desta aba e ficam também em Envelope; aqui só os controles de uso rápido.','LEARN por controle sai: vira o botão global MIDI LEARN no rodapé.'],'old'],['DESKTOP',['Tudo cabe sem rolagem em 1300 × 1060.','Alvos de mouse de 24 px; o app atual usa de 18 a 36.']]]));

/* 3 hammond moog */
const db=(l,v,f,red)=>`<div class=kc><div class=lbl>${l}</div><div style="height:90px;width:24px;margin:0 auto;background:#0b0d10;border:1px solid #2b323b;border-radius:3px;position:relative"><div style="position:absolute;left:2px;right:2px;top:${(1-f)*66+3}px;height:16px;border-radius:2px;background:${red?'#d65151':'#e6e0d2'}"></div></div><div class=v style="font-size:11px">${v}</div></div>`;
const hdr=(t,sub,c)=>`<div style="padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2b323b"><div style="width:8px;height:22px;background:${c};border-radius:2px"></div><b style="font-size:13px">${t}</b><span style="font-size:11px;color:#8b95a1">${sub}</span></div>`;
P.push(page(3,'Inspetor: Hammond e Moog','A aba SOM muda por motor; abas MIDI, Efeitos e Velocity são iguais para todos.',
win(hdr('Layer 5 · Hammond','Jimmy Gospel','#ff8a5c')+tabs(T,0)+`<div style="display:flex;gap:10px;padding:10px">${pn('PRESET E DRAWBARS',sel('Órgão','Jimmy Gospel')+`<div style="display:flex">${[['16\'',8,1,1],['5⅓\'',8,1,1],['8\'',7,.9],['4\'',6,.75],['2⅔\'',8,1,1],['2\'',5,.6],['1⅗\'',4,.5],['1⅓\'',3,.4],['1\'',2,.25]].map(a=>db(...a)).join('')}</div>`,'width:470px')}${pn('LESLIE E PERCUSSÃO',`<div class=lbl>Leslie</div>`+seg(['STOP','CHORALE','FAST'],1,'am')+`<div class=lbl>Percussão</div>`+seg(['OFF','2ND','3RD'],0,'am')+`<div class=lbl>Harmônico</div>`+seg(['2ª','3ª'],1,'am'),'width:300px')}${pn('CARÁTER',`<div style="display:flex;flex-wrap:wrap;row-gap:10px">${[['Key click','15',.15,'%'],['Leakage','12',.12,'%'],['Drive','8',.08,'%'],['Level','75',.75,'%']].map(a=>`<div style="width:50%">${kn(...a)}</div>`).join('')}</div>`,'flex:1')}</div>`,1300,330)+
win(hdr('Layer 6 · Moog','Classic Keys Analog · browser 12 dB','#5ee0c0')+tabs(T,0)+`<div style="display:flex;gap:10px;padding:10px">${pn('PRESET',sel('Preset analógico','Inicial')+row(btn('Exportar','','flex:1')+btn('Importar','','flex:1')),'width:300px')}${pn('OSCILADORES E FILTRO',`<div style="display:flex;flex-wrap:wrap;row-gap:10px">${[['Osc 1','Saw',.5,''],['Osc 2','Saw',.5,''],['Osc 3','Sq',.3,''],['Mix','0',0,''],['Cutoff','69',.69,'%'],['Resson.','30',.3,'%'],['Drive','0',0,''],['Keytrack','50',.5,'%']].map(a=>`<div style="width:12.5%">${kn(...a)}</div>`).join('')}</div>`,'flex:1')}${pn('CONTROLES',`<div style="display:flex;flex-wrap:wrap;row-gap:10px">${[['Volume',80,.6,'%'],['Reverb',0,0,'%'],['Comp',0,0,'%'],['Ganho','0,0',.5,'dB']].map(a=>`<div style="width:50%">${kn(...a)}</div>`).join('')}</div>`,'width:300px')}</div>`,1300,310),
[['O QUE MUDA',['Drawbars, Leslie e percussão agrupados na aba SOM do Hammond.','Sliders horizontais de key click, leakage, drive e level viram knobs.','Moog: osciladores e filtro em um painel; presets e controles de camada separados.','Duplicata "Exportar Preset" removida.'],'old'],['ATENÇÃO',['O painel interno do Moog não estava nos seus prints: os parâmetros mostrados (osciladores, mix, keytrack) são uma proposta e precisam bater com o painel real antes de implementar.']]]));

/* 4 efeitos envelope velocity */
P.push(page(4,'Efeitos, Envelope e Velocity','Em desktop os painéis cabem lado a lado: não precisa abrir janela.',
win(hdr('Layer 1 · Piano Nord (NPNO)','Efeitos','#f5a524')+tabs(T,3)+`<div style="padding:10px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:6px;align-items:stretch"><div class="fx on"><b>EQ</b><i>ligado</i></div><div class=arrow>→</div><div class="fx on"><b>COMPRESSOR</b><i>ligado</i></div><div class=arrow>→</div><div class=fx><b>REVERB</b><i>off</i></div><div class=arrow>→</div><div class=fx><b>TREMOLO</b><i>off</i></div><div class=arrow>→</div><div class="fx on"><b>DELAY</b><i>ligado</i></div><div class=arrow>→</div><div class=fx><b>FLANGER</b><i>off</i></div><div class=arrow>→</div><div class=fx><b>CHORUS</b><i>off</i></div></div>
<div style="display:flex;gap:10px">${pn('COMPRESSOR',`<div style="display:flex">${[['Threshold','-18',.7,'dB'],['Ratio','4,0',.25,':1'],['Attack','10',.1,'ms'],['Release','120',.3,'ms'],['Makeup','0,0',0,'dB']].map(a=>kn(...a)).join('')}</div>`,'width:520px')}${pn('DELAY',`<div style="display:flex">${[['BPM','120',.4,''],['Feedback','30',.3,'%'],['Mix','0',0,'%']].map(a=>kn(...a)).join('')}</div>`+btn('TAP TEMPO','','width:100%'),'width:340px')}${pn('EQ DA LAYER',`<div style="display:flex">${[['Low','0,0',.5,'dB'],['Mid','0,0',.5,'dB'],['High','0,0',.5,'dB'],['Low cut','20',0,'Hz'],['High cut','20000',1,'Hz']].map(a=>kn(...a)).join('')}</div>`,'flex:1')}</div></div>`,1300,330)+
