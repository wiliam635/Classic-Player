name: Build Classic Player - macOS Universal

on:
  workflow_dispatch:

jobs:
  build-macos-universal:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight native source
        run: |
          test -f Source/ExternalInstrumentHost.h
          test -f Source/ExternalInstrumentHost.cpp
          test -f Source/PluginProcessor.cpp
          test -f Source/Dx7Engine.h
          test -f Source/Dx7Engine.cpp
          test -f Source/AnalogSynthEngine.h
          test -f Source/AnalogSynthEngine.cpp
          grep -q "juce_audio_processors/juce_audio_processors.h" Source/ExternalInstrumentHost.h
          ! grep -q "JuceHeader.h" Source/ExternalInstrumentHost.h
          grep -q "loadExternalInstrument" Source/PluginProcessor.h
          grep -q "createExternalInstrumentEditor" Source/PluginProcessor.h
          grep -q "learnChannel" Source/PluginProcessor.cpp
          grep -q "midiLearnChannel" Source/PluginProcessor.cpp
          grep -q "resetMidiLearn" Source/PluginProcessor.cpp
          grep -q "resetMidiLearnButton" Source/PluginEditor.cpp
          grep -q "refreshExternalInstrumentLibrary" Source/PluginEditor.cpp
          grep -q "accidentalStyleBox" Source/PluginEditor.cpp
          grep -q "formatAccidentals" Source/ChordDetector.cpp
          grep -q "cc == 64" Source/PluginProcessor.cpp
          grep -q "externalPeaks" Source/PluginProcessor.cpp
          ! grep -q "isChannelMessage" Source/PluginProcessor.cpp
          grep -q "saveProgram" Source/PluginProcessor.h
          grep -q "loadProgram" Source/PluginProcessor.h
          grep -q "NOVO PROGRAMA" Source/PluginEditor.cpp
          grep -q "refreshProgramLibrary" Source/PluginEditor.cpp
          grep -q "loadSelectedProgram" Source/PluginEditor.cpp
          grep -q "findInstalledInstruments" Source/ExternalInstrumentHost.cpp
          grep -q "if (externalEditorWindow != nullptr)" Source/PluginEditor.cpp
          grep -q "externalEditorWindow->toFront(true)" Source/PluginEditor.cpp
          grep -q "ExternalInstrumentHost.cpp" CMakeLists.txt
          grep -q "Dx7Engine.cpp" CMakeLists.txt
          grep -q "AnalogSynthEngine.cpp" CMakeLists.txt
          grep -q "LayerType::analog" Source/PluginProcessor.cpp
          grep -q "analogSynthEngine.process" Source/PluginProcessor.cpp
          grep -q "showAnalogSynthEditor" Source/PluginEditor.cpp
          grep -q "Classic Keys Analog" Source/PluginEditor.cpp
          grep -q "renderVoice(Voice& voice, const Config& config, float lfo" Source/AnalogSynthEngine.h
          grep -q "renderVoice(voice, config, lfo" Source/AnalogSynthEngine.cpp
          grep -q "routedMidi = nullptr" Source/AnalogSynthEngine.h
          grep -q "The JUCE standalone device callback supplies MIDI" Source/AnalogSynthEngine.cpp
          grep -q "analogSynthEngine.process(buffer, midi, analogLayerConfigs, &routedMidiBuffers)" Source/PluginProcessor.cpp
          grep -q "SOLO LEAD" Source/PluginEditor.cpp
          grep -q "ATMOSPHERIC PAD" Source/PluginEditor.cpp
          grep -q "DUB BASS" Source/PluginEditor.cpp
          grep -q "stevebarakat/Minimoog" THIRD_PARTY.md
          grep -q "startAudioRecording" Source/PluginProcessor.cpp
          grep -q "stopAudioRecording" Source/PluginProcessor.cpp
          grep -q "WavAudioFormat" Source/PluginProcessor.cpp
          grep -q "recordingButton" Source/PluginEditor.cpp
          grep -q "void Dx7Engine::process" Source/Dx7Engine.cpp
          grep -q "fixedFrequency" Source/Dx7Engine.cpp
          test -f third_party/msfa/dx7note.cc
          test -f third_party/msfa/fm_core.cc
          test -f third_party/msfa/libMTSClient.h
          grep -q "coreVoice->compute" Source/Dx7Engine.cpp
          grep -q "PitchEnv::init(sampleRate)" Source/Dx7Engine.cpp
          grep -q "Porta::init_sr(sampleRate)" Source/Dx7Engine.cpp
          grep -Fq "values_[kControllerPitch] = 0x2000" third_party/msfa/controllers.h
          grep -q "patch.feedback" Source/Dx7Engine.cpp
          grep -q 'state.setProperty("mono"' Source/PluginProcessor.cpp
          grep -q 'config.mono = state.getProperty("mono"' Source/PluginProcessor.cpp
          grep -q 'config.portamento = state.getProperty("portamento"' Source/PluginProcessor.cpp
          grep -q "Do not also enable FluidSynth CC126/127 mode" Source/Sf2Engine.cpp
          grep -q "if (!monoMode)" Source/Sf2Engine.cpp

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 39344dff01c5a5a0134caf2624cdd492f05d30ea
          runVcpkgInstall: false

      - name: Build universal standalone app
        run: |
          chmod +x scripts/build-macos-universal-compat.sh
          scripts/build-macos-universal-compat.sh

      - name: Package universal app
        env:
          APP_PATH: ${{ github.workspace }}/build/Classic Player 1.6.1 macOS Universal.app
          OUTPUT_DIR: ${{ github.workspace }}/outputs/installers
        run: |
          chmod +x scripts/package-macos-universal-compat.sh
          scripts/package-macos-universal-compat.sh

      - name: Verify package and approved native interface
        run: |
          grep -q "CLASSIC KEYS SF2 WORKSTATION" Source/PluginEditor.cpp
          grep -q "set(CLASSIC_PLAYER_FORMATS Standalone VST3)" CMakeLists.txt
          test -d "build/Classic Player 1.6.1 macOS Universal.app"
          test -f "outputs/installers/Classic-Player-1.6.1-macOS-High-Sierra-a-Tahoe-Universal.pkg"
          test -f "outputs/installers/Classic-Player-1.6.1-macOS-High-Sierra-a-Tahoe-Universal-App.zip"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: Classic-Player-1.6.1-macOS-Universal
          if-no-files-found: error
          path: |
            outputs/installers/Classic-Player-1.6.1-macOS-High-Sierra-a-Tahoe-Universal.pkg
            outputs/installers/Classic-Player-1.6.1-macOS-High-Sierra-a-Tahoe-Universal-App.zip
