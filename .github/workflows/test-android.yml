name: Android - emulator audio regression

on:
  workflow_dispatch:
  push:
    branches: ['codex/fix-user-refresh']

permissions:
  contents: read

jobs:
  emulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run android tests]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          ndk: 26.3.11579264
          cmake: 3.22.1
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p android-test-artifacts
            adb logcat -c
            result=0
            gradle --no-daemon -p android -PtestAbis=x86_64 :app:connectedDebugAndroidTest || result=$?
            adb logcat -d > android-test-artifacts/logcat.txt
            adb pull /sdcard/Android/data/com.classickeys.classicplayer/files/audio-regression android-test-artifacts/ || true
            exit "$result"
      - name: Upload reports even on regression failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-emulator-audio-report
          if-no-files-found: warn
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android-test-artifacts/
