name: Test Classic Player VST3 - Windows x64

on:
  workflow_dispatch:
  push:
    branches: [codex/fix-user-refresh]
    paths:
      - .github/workflows/test-vst3-windows.yml
      - installer/windows/ClassicPlayerVst3Test.iss
      - CMakeLists.txt
      - Source/PluginEditor.cpp
      - Source/PluginEditor.h
      - Source/PluginProcessor.cpp
      - Source/PluginProcessor.h
      - Source/HammondRegressionTest.cpp

jobs:
  vst3-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Install vcpkg dependencies
        uses: lukka/run-vcpkg@v11

      - name: Configure x64
        shell: pwsh
        run: cmake --preset windows-x64

      - name: Build standalone and VST3
        shell: pwsh
        run: cmake --build build\windows-x64 --target ClassicPlayer_Standalone ClassicPlayer_VST3 --config Release --parallel 2

      - name: Stage runtime DLLs and verify the VST3 loads
        shell: pwsh
        run: |
          $bundle = "build\windows-x64\ClassicPlayer_artefacts\Release\VST3\Classic Player.vst3"
          if (-not (Test-Path $bundle -PathType Container)) { throw "VST3 não gerado: $bundle" }
          $binary = Get-ChildItem $bundle -Recurse -Filter "*.vst3" -File | Select-Object -First 1
          if (-not $binary) { throw "Binário VST3 não encontrado dentro do bundle" }
          # The dynamic vcpkg triplet does not embed FluidSynth/OpenSSL and their
          # dependencies. Windows searches beside the VST3 module, not beside Reaper.
          $vcpkgBin = "build\windows-x64\vcpkg_installed\x64-windows\bin"
          if (-not (Test-Path $vcpkgBin -PathType Container)) { throw "DLLs vcpkg ausentes: $vcpkgBin" }
          Get-ChildItem $vcpkgBin -Filter "*.dll" -File |
            Copy-Item -Destination $binary.DirectoryName -Force
          $standaloneDir = "build\windows-x64\ClassicPlayer_artefacts\Release\Standalone"
          if (-not (Test-Path "$standaloneDir\Classic Player.exe")) { throw "Standalone ausente" }
          Get-ChildItem $vcpkgBin -Filter "*.dll" -File |
            Copy-Item -Destination $standaloneDir -Force
          New-Item -ItemType Directory -Force "$standaloneDir\Resources\WebUI" | Out-Null
          Copy-Item "Resources\WebUI\*" "$standaloneDir\Resources\WebUI" -Recurse -Force
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Vst3Loader {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibraryEx(string path, IntPtr file, uint flags);
              [DllImport("kernel32.dll", CharSet = CharSet.Ansi, SetLastError = true)]
              public static extern IntPtr GetProcAddress(IntPtr module, string name);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          $module = [Vst3Loader]::LoadLibraryEx($binary.FullName, [IntPtr]::Zero, 0x00001100)
          if ($module -eq [IntPtr]::Zero) {
            throw "VST3 não carrega no Windows (erro Win32 $([Runtime.InteropServices.Marshal]::GetLastWin32Error()))."
          }
          try {
            if ([Vst3Loader]::GetProcAddress($module, "GetPluginFactory") -eq [IntPtr]::Zero) {
              throw "GetPluginFactory ausente no VST3."
            }
          } finally {
            [Vst3Loader]::FreeLibrary($module) | Out-Null
          }
          Write-Host "VST3 carregado e GetPluginFactory encontrado."
          New-Item -ItemType Directory -Force "outputs\vst3-test" | Out-Null
          Compress-Archive -Path $bundle -DestinationPath "outputs\vst3-test\Classic-Player-2.0.1-VST3-teste-Windows-x64.zip" -Force

      - name: Package combined test installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows\ClassicPlayerVst3Test.iss"
          if ($LASTEXITCODE -ne 0) { throw "Instalador de teste falhou" }
          $setup = "outputs\vst3-test\Classic-Player-2.0.1-Standalone-VST3-teste-Windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Instalador de teste não foi criado" }

      - name: Upload test plugin
        uses: actions/upload-artifact@v4
        with:
          name: Classic-Player-2.0.1-VST3-teste-${{ github.run_number }}-Windows-x64
          if-no-files-found: error
          path: |
            outputs/vst3-test/Classic-Player-2.0.1-VST3-teste-Windows-x64.zip
            outputs/vst3-test/Classic-Player-2.0.1-Standalone-VST3-teste-Windows-x64-Setup.exe
