name: Build Classic Player - Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Install vcpkg dependencies
        uses: lukka/run-vcpkg@v11

      - name: Configure with Visual Studio 2022 x64
        shell: pwsh
        run: cmake --preset windows-x64

      - name: Build release
        shell: pwsh
        run: cmake --build --preset windows-release --parallel 2

      - name: Verify WebUI source
        shell: pwsh
        run: |
          if (-not (Test-Path "Resources/WebUI/index.html")) {
            throw "Resources/WebUI/index.html ausente"
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: classic-player-windows-build
          if-no-files-found: error
          path: |
            build/windows-x64/**
            Resources/WebUI/**
