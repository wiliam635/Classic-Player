name: Build Classic Player - Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight native source
        shell: pwsh
        run: |
          $required = @(
            "Source\ExternalInstrumentHost.h",
            "Source\ExternalInstrumentHost.cpp",
            "Source\PluginProcessor.cpp"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Arquivo obrigatório ausente: $file" }
          }
          $hostHeader = Get-Content "Source\ExternalInstrumentHost.h" -Raw
          $processorHeader = Get-Content "Source\PluginProcessor.h" -Raw
          $processorSource = Get-Content "Source\PluginProcessor.cpp" -Raw
          $cmake = Get-Content "CMakeLists.txt" -Raw
          if ($hostHeader -notmatch "juce_audio_processors/juce_audio_processors.h") { throw "Include JUCE do host ausente" }
          if ($hostHeader -match "JuceHeader.h") { throw "JuceHeader.h não pode ser usado no host externo" }
          if ($processorHeader -notmatch "loadExternalInstrument") { throw "API loadExternalInstrument ausente" }
          if ($processorHeader -notmatch "createExternalInstrumentEditor") { throw "API createExternalInstrumentEditor ausente" }
          if ($processorSource -notmatch "learnChannel") { throw "Persistência MIDI Learn incompleta" }
          if ($processorSource -notmatch "midiLearnChannel") { throw "Canal MIDI aprendido não é exposto" }
          if ($processorSource -notmatch "resetMidiLearn") { throw "Reset de MIDI Learn ausente" }
          $editorSource = Get-Content "Source\PluginEditor.cpp" -Raw
          if ($editorSource -notmatch "resetMidiLearnButton") { throw "Botão RESET CC ausente" }
          if ($editorSource -notmatch "refreshExternalInstrumentLibrary") { throw "Atualização global de VST ausente" }
          if ($editorSource -notmatch "accidentalStyleBox") { throw "Seleção de acidentes ausente" }
          if ((Get-Content "Source\ChordDetector.cpp" -Raw) -notmatch "formatAccidentals") { throw "Formatação de acidentes ausente" }
          if ($processorSource -notmatch "cc == 64") { throw "Reserva do CC64 para sustain ausente" }
          if ($processorSource -notmatch "externalPeaks") { throw "Medidor de VST por layer ausente" }
          if ($processorSource -match "isChannelMessage") { throw "API MIDI incompatível com JUCE 9" }
          if ($processorHeader -notmatch "saveProgram") { throw "API de programação salva ausente" }
          if ($processorHeader -notmatch "loadProgram") { throw "API de carregamento de programação ausente" }
          $editorSource = Get-Content "Source\PluginEditor.cpp" -Raw
          if ($editorSource -notmatch "NOVO PROGRAMA") { throw "Campo de programas salvos ausente" }
          if ($editorSource -notmatch "refreshProgramLibrary") { throw "Lista de programas salvos ausente" }
          if ($editorSource -notmatch "loadSelectedProgram") { throw "Carregamento de programas salvos ausente" }
          if ((Get-Content "Source\ExternalInstrumentHost.cpp" -Raw) -notmatch "findInstalledInstruments") { throw "Busca automática de VST ausente" }
          $editorSource = Get-Content "Source\PluginEditor.cpp" -Raw
          if ($editorSource -notmatch "if \(externalEditorWindow != nullptr\)") { throw "Proteção de reabertura do editor VST ausente" }
          if ($editorSource -notmatch "externalEditorWindow->toFront\(true\)") { throw "Reutilização da janela do editor VST ausente" }
          if ($cmake -notmatch "ExternalInstrumentHost.cpp") { throw "Host externo ausente do CMake" }
          $dx7Source = Get-Content "Source\Dx7Engine.cpp" -Raw
          if ($dx7Source -notmatch "fixedFrequency") { throw "Frequência fixa DX7 não é renderizada" }
          if ($dx7Source -notmatch "array<std::array<uint8_t, 6>, 32> algorithms") { throw "32 algoritmos DX7 não são renderizados" }
          if ($dx7Source -notmatch "patch.feedback") { throw "Feedback DX7 não é renderizado" }
          if ($processorSource -notmatch 'state\.setProperty\("mono"') { throw "Modo Mono Legato não é salvo" }
          if ($processorSource -notmatch 'config\.mono = state\.getProperty\("mono"') { throw "Modo Mono Legato não é restaurado" }
          if ($processorSource -notmatch 'config\.portamento = state\.getProperty\("portamento"') { throw "Modo Portamento não é restaurado" }

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Install vcpkg dependencies
        uses: lukka/run-vcpkg@v11

      - name: Configure with Visual Studio 2022 x64
        shell: pwsh
        run: cmake --preset windows-x64

      - name: Build native release
        shell: pwsh
        run: cmake --build --preset windows-release --parallel 2

      - name: Verify native artifacts before packaging
        shell: pwsh
        run: |
          $standalone = "build\windows-x64\ClassicPlayer_artefacts\Release\Standalone\Classic Player.exe"
          if (-not (Test-Path $standalone)) { throw "Standalone nativo não foi gerado: $standalone" }
          if (-not (Test-Path "build\windows-x64\ClassicPlayer_artefacts\Release\VST3\Classic Player.vst3")) {
            throw "VST3 não foi gerado."
          }
          if (-not (Test-Path "Resources\WebUI\index.html")) { throw "Resources/WebUI/index.html ausente" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package installer
        shell: pwsh
        run: scripts\package-windows.ps1

      - name: Verify installer payload
        shell: pwsh
        run: |
          $installer = "outputs\installers\Classic-Player-1.6.1-Windows-x64-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Instalador não foi criado." }
          Get-FileHash -Algorithm SHA256 $installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Classic-Player-1.6.1-Windows-x64
          if-no-files-found: error
          path: outputs/installers/Classic-Player-1.6.1-Windows-x64-Setup.exe
