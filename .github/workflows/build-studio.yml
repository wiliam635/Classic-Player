name: Build Classic Player Studio

on:
  workflow_dispatch:
  push:
    paths:
      - 'studio/**'
      - '.github/workflows/build-studio.yml'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            name: macOS
          - os: windows-2022
            name: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S studio -B studio/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCLASSIC_PLAYER_STUDIO_FETCH_JUCE=ON
      - name: Build
        shell: bash
        run: cmake --build studio/build --config Release --parallel 2
      - name: Test session persistence
        shell: bash
        run: ctest --test-dir studio/build -C Release --output-on-failure
      - name: Package macOS test build
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          app="studio/build/ClassicPlayerStudio_artefacts/Release/Classic Player Studio.app"
          package_dir="studio/package"
          staging_dir="${RUNNER_TEMP}/classic-player-studio-dmg"
          pkgroot_dir="${RUNNER_TEMP}/classic-player-studio-pkgroot"
          component_plist="${RUNNER_TEMP}/classic-player-studio-component.plist"

          test -d "$app"
          rm -rf "$package_dir" "$staging_dir" "$pkgroot_dir"
          mkdir -p "$package_dir" "$staging_dir" "$pkgroot_dir"

          # The CI build is intentionally unsigned, but it must still have a
          # complete bundle signature so macOS does not report a damaged app.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          ditto "$app" "$staging_dir/Classic Player Studio.app"
          ln -s /Applications "$staging_dir/Applications"

          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "$package_dir/Classic-Player-Studio-macOS.zip"
          hdiutil create -volname "Classic Player Studio" \
            -srcfolder "$staging_dir" -ov -format UDZO \
            "$package_dir/Classic-Player-Studio-macOS.dmg"

          # Disable Apple's bundle relocation heuristic. Without this, a
          # previous copy in Downloads can cause Installer to put the new app
          # back beside that old copy instead of /Applications.
          ditto "$app" "$pkgroot_dir/Classic Player Studio.app"
          cat > "$component_plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <array><dict>
            <key>RootRelativeBundlePath</key>
            <string>Classic Player Studio.app</string>
            <key>BundleIsRelocatable</key>
            <false/>
            <key>BundleIsVersionChecked</key>
            <true/>
            <key>BundleHasStrictIdentifier</key>
            <true/>
          </dict></array>
          </plist>
          EOF
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          pkgbuild --root "$pkgroot_dir" \
            --component-plist "$component_plist" \
            --identifier com.classickeys.classicplayerstudio \
            --version "$version" \
            --install-location /Applications \
            "$package_dir/Classic-Player-Studio-macOS.pkg"
      - name: Upload macOS Studio build
        if: matrix.name == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Classic-Player-Studio-${{ matrix.name }}
          if-no-files-found: error
          path: studio/package
      - name: Upload Windows Studio build
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Classic-Player-Studio-${{ matrix.name }}
          if-no-files-found: error
          path: studio/build/ClassicPlayerStudio_artefacts/Release
