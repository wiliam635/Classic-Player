name: Test Classic Player VST3 - macOS Universal

on:
  workflow_dispatch:
    inputs:
      final_release:
        description: Publicar somente o instalador final 2.0.1
        type: boolean
        default: false
  push:
    branches: [codex/fix-user-refresh]
    paths:
      - .github/workflows/test-vst3-macos.yml
      - installer/macos/components-vst3-test.plist
      - installer/macos/components-vst3-final.plist
      - scripts/package-macos-vst3-test.sh
      - scripts/build-macos-universal-compat.sh
      - Source/PluginEditor.cpp
      - Source/PluginEditor.h
      - Source/PluginProcessor.cpp
      - Source/PluginProcessor.h
      - Source/HammondRegressionTest.cpp

jobs:
  vst3-macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 39344dff01c5a5a0134caf2624cdd492f05d30ea
          runVcpkgInstall: false

      - name: Configure dependencies and both architectures
        run: bash scripts/build-macos-universal-compat.sh

      - name: Build VST3 and AU for Intel and Apple Silicon
        run: |
          cmake --build build/macos-compat-x86_64 --target ClassicPlayer_VST3 ClassicPlayer_AU --parallel 4
          cmake --build build/macos-compat-arm64 --target ClassicPlayer_VST3 ClassicPlayer_AU --parallel 4

      - name: Assemble and verify universal VST3
        shell: bash
        run: |
          set -euo pipefail
          arm="build/macos-compat-arm64/ClassicPlayer_artefacts/Release/VST3/Classic Player.vst3"
          intel="build/macos-compat-x86_64/ClassicPlayer_artefacts/Release/VST3/Classic Player.vst3"
          output="outputs/vst3-test/Classic Player.vst3"
          test -f "$arm/Contents/MacOS/Classic Player"
          test -f "$intel/Contents/MacOS/Classic Player"
          mkdir -p outputs/vst3-test
          ditto "$arm" "$output"
          lipo -create "$intel/Contents/MacOS/Classic Player" "$arm/Contents/MacOS/Classic Player" \
            -output "$output/Contents/MacOS/Classic Player"
          /usr/bin/xattr -cr "$output"
          codesign --force --deep --sign - "$output"
          codesign --verify --deep --strict "$output"
          lipo "$output/Contents/MacOS/Classic Player" -verify_arch x86_64 arm64
          hdiutil create -volname "Classic Player VST3 Teste" -srcfolder "$output" \
            -ov -format UDZO \
            "outputs/vst3-test/Classic-Player-2.0.1-VST3-teste-macOS-Universal.dmg"
          hdiutil verify "outputs/vst3-test/Classic-Player-2.0.1-VST3-teste-macOS-Universal.dmg"

      - name: Assemble and verify universal AU
        shell: bash
        run: |
          set -euo pipefail
          arm="build/macos-compat-arm64/ClassicPlayer_artefacts/Release/AU/Classic Player.component"
          intel="build/macos-compat-x86_64/ClassicPlayer_artefacts/Release/AU/Classic Player.component"
          output="outputs/vst3-test/Classic Player.component"
          test -f "$arm/Contents/MacOS/Classic Player"
          test -f "$intel/Contents/MacOS/Classic Player"
          ditto "$arm" "$output"
          lipo -create "$intel/Contents/MacOS/Classic Player" "$arm/Contents/MacOS/Classic Player" \
            -output "$output/Contents/MacOS/Classic Player"
          /usr/bin/xattr -cr "$output"
          codesign --force --deep --sign - "$output"
          codesign --verify --deep --strict "$output"
          lipo "$output/Contents/MacOS/Classic Player" -verify_arch x86_64 arm64
          plutil -lint "$output/Contents/Info.plist"

      - name: Package standalone, VST3 and AU test installer
        shell: bash
        env:
          FINAL_RELEASE: ${{ inputs.final_release && '1' || '0' }}
        run: bash scripts/package-macos-vst3-test.sh

      - name: Upload test plug-ins and combined installer
        if: ${{ inputs.final_release != true }}
        uses: actions/upload-artifact@v4
        with:
          name: Classic-Player-2.0.1-VST3-AU-teste-${{ github.run_number }}-macOS-Universal
          if-no-files-found: error
          path: |
            outputs/vst3-test/Classic-Player-2.0.1-VST3-teste-macOS-Universal.dmg
            outputs/vst3-test/Classic-Player-2.0.1-Standalone-VST3-AU-teste-macOS-Universal.pkg

      - name: Upload final installer
        if: ${{ inputs.final_release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: Classic-Player-2.0.1-macOS-Universal
          if-no-files-found: error
          path: outputs/vst3-test/Classic-Player-2.0.1-macOS-Universal.pkg
